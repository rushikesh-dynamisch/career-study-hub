name: "first workflow"
on: push
jobs:
  Test-job:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          node-version: 24
          cache: 'npm'
      - name: install dependencies
        run: npm install 
      - name: run test cases
        run: npm run test
    
  Build-job:
    needs: [Test-job]
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          node-version: 24
          cache: 'npm'
      - name: install dependencies
        run: npm install 
      - name: run test cases
        run: npm run test
      - name: create build
        run: npm run build
      - name: create artifacts
        run: actions/upload-artifact@v4
        with:
          name: react-build
          path: dist/
          retention-days: 5